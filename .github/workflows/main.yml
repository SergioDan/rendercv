name: Render CV

on:
  push:
    paths:
      - ".github/workflows/**"
      - "**/*.yaml"
      - "**/*.yml"

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del repo público (rendercv fork)
      - name: Checkout rendercv repo
        uses: actions/checkout@v4

      # 2. Checkout del repo PRIVADO con el CV
      - name: Checkout private CV repo
        uses: actions/checkout@v4
        with:
          repository: SergioDan/sergio-cv
          token: ${{ secrets.CV_REPO_TOKEN }}
          path: cv

      # 3. Instalar Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 4. Instalar RenderCV completo
      - name: Install RenderCV
        run: |
          python -m pip install --upgrade pip
          pip install "rendercv[full]"

      # 5. Debug: ver archivos (opcional pero útil)
      - name: Debug file structure
        run: |
          echo "Root:"
          ls -la
          echo "CV repo:"
          ls -la cv

      # 6. Renderizar el CV backend
      - name: Render Sergio Backend CV
        run: |
          rendercv render cv/sergio_ramirez_cv_backend.yaml

      # 7. Subir el PDF como Artifact
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: sergio-ramirez-backend-cv
          path: rendercv_output/*.pdf
